# Default values for the HoardMQ chart. Every value below is referenced by a
# template; the chart's self-check test keeps the two in step.

# The image to run, which the chart cannot render without: the project
# publishes none, so build one from the reference Dockerfile and push it to
# a registry the cluster pulls from (chart README).
image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

# Number of broker pods. Size for N-1: a rolling restart runs the cluster
# one node short, and cluster.replicas (copies of each session) must be at
# most replicaCount - 1 for a node loss to leave a copy standing.
replicaCount: 3

cluster:
  # Cluster identifier all nodes must share.
  id: hoardmq
  # The most pods the cluster can grow to without a rolling restart: every
  # node dials every ordinal below it, retrying the ones not running, so a
  # change of replicaCount up to it leaves the configuration and the pods as
  # they are. Raising it rolls the StatefulSet; replicaCount above it is
  # refused.
  maxReplicas: 7
  # Copies of every session and retained message (owner plus followers).
  replicas: 2
  # Virtual shards; fixed for the life of the cluster.
  shards: 64
  # Cluster transport port on the headless Service.
  port: 7000
  drain:
    # The least number of clients redirected per second during a drain. A
    # drain with more clients redirects faster, so that it has redirected
    # them all by timeoutSeconds less the broker's takeover timeout (5 s by
    # default): its length does not grow with its clients.
    ratePerSecond: 100
    # How long a drain waits for redirected clients' takeovers before handing
    # the remaining leases to a live node.
    timeoutSeconds: 30
    # How long a drain then waits for every session it handed off to be
    # confirmed held by its receiver; sessions still unconfirmed are counted
    # and logged, and the pod stops.
    confirmTimeoutSeconds: 30
    # The termination grace period is both timeouts plus this margin.
    graceMarginSeconds: 15
    # After its drain completes, how long a broker waits for the SIGTERM the
    # kubelet sends once the preStop hook has returned; the hook reads the
    # completion and exits first, so it is not killed with the broker. Keep
    # it above the hook's poll (one second) and its request timeout (five).
    holdExitSeconds: 15
  readiness:
    # The topology (members and the alive set) must be unchanged this long
    # before a pod reports ready.
    stableSeconds: 5

# Mutual TLS between nodes.
tls:
  # generated: the chart creates a CA and a node certificate (SANs for every
  # ordinal) in a Secret and reuses it across upgrades.
  # certManager: an Issuer and Certificate are created for cert-manager.
  # certManagerCSI: no pod starts while cert-manager or its issuer is down;
  # in exchange cert-manager's CSI driver, a prerequisite, makes each pod's
  # key on its node, in that pod's volume only (see the chart README, "TLS
  # between nodes").
  mode: generated
  # Days of validity for generated certificates.
  generatedValidityDays: 3650
  certManager:
    # Existing ClusterIssuer or Issuer to sign the node certificates, in both
    # cert-manager modes; empty makes a private CA in the release namespace.
    issuerRef:
      name: ""
      kind: ClusterIssuer
  # The certificates the CSI driver issues; tls.certManager.issuerRef names
  # their issuer.
  certManagerCSI:
    duration: 2160h
    renewBefore: 360h

# The MQTT listener clients reach through the client Service.
listeners:
  mqtt:
    port: 1883
    # Connections this listener holds at once on each pod; one more is
    # closed at accept. Sized to the default memory limit (see the chart
    # README, "Limits"); raise the two together. 0 is unlimited.
    maxConnections: 20000
  # Optional TLS listener for clients; set enabled and a Secret holding
  # tls.crt and tls.key.
  mqtts:
    enabled: false
    port: 8883
    secretName: ""
    # As for mqtt; with both listeners a pod may hold the sum.
    maxConnections: 20000
  # More listeners, appended after mqtt and mqtts without restating them.
  # Each entry needs name (a port name: at most 15 characters, lower case),
  # type and port; every other member is passed to the broker's listener as
  # written (tls, maxConnections, path, ...). Each gets a container port and a
  # port on the client Service of its name. For example:
  #   - { name: ws, type: ws, port: 8080, path: /mqtt }
  extra: []

# Each pod's limits (see the chart README, "Limits", for the values'
# reasons). The broker's own defaults are unlimited; 0 turns one off.
limits:
  # CONNECTs a second the pod admits across its listeners; one over it is
  # refused before its credentials are read.
  connectRate: 2000
  # How many it admits at once; 0 is twice connectRate.
  connectBurst: 0
  # Topic filters one client's session may hold; a SUBSCRIBE filter past it
  # is refused and the client stays connected.
  maxSubscriptions: 100
  # The longest keep-alive a client may use, in seconds, a keep-alive of 0
  # included: a client silent for one and a half times it is closed.
  maxKeepAlive: 3600
  # QoS 1 and 2 messages in flight to one client before the rest wait in its
  # queue; a client asking for fewer keeps its own.
  maxInflightMessages: 1024

service:
  type: ClusterIP
  # Set for LoadBalancer or NodePort services when clients are outside the
  # cluster; empty derives the advertised address from the pod's headless
  # Service name.
  advertiseHost: ""

observability:
  # The metrics, health and drain listener; bound on all interfaces inside
  # the pod so the kubelet's probes reach it. Its /drain answers only
  # loopback callers, the preStop's, and is closed when the admin API is
  # enabled.
  port: 9090

# The admin REST API. Off by default. Enabled, it listens on the pod's
# loopback (reach it with kubectl port-forward), the chart generates a drain
# token for the preStop and an operator token in the Secret
# <release>-admin, kept across upgrades, and the preStop drains through the
# API with the drain token.
admin:
  enabled: false
  port: 9091

persistence:
  size: 10Gi
  storageClassName: ""

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 1Gi

podDisruptionBudget:
  enabled: true

# The broker container's security context. The broker writes only its data
# directory, the volume mounted at /var/lib/hoardmq, so the root filesystem is
# read-only. A value set here replaces this one whole; {} sets none.
containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# A NetworkPolicy admitting only the broker's own traffic. Off by default: a
# policy that does not fit the deployment cuts it off. On, it admits the
# cluster port from the release's pods only, the client ports (mqtt, mqtts,
# every extra listener) from clientFrom, and the observability port (probes,
# metrics) from observabilityFrom; an empty list admits any source. Egress is
# not restricted.
networkPolicy:
  enabled: false
  clientFrom: []
  observabilityFrom: []

# A prometheus-operator ServiceMonitor scraping /metrics on every pod's
# observability port. Off by default; it needs the operator's CRD. labels are
# added to it, for a Prometheus that selects ServiceMonitors by label.
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

# Prefer spreading pods over nodes.
podAntiAffinity: preferred

# Anonymous connections are off by default; provide users and an ACL through
# extraConfig (see the chart README) or another auth module.
auth:
  anonymous: false

# Log level for the broker.
logLevel: info

# Extra members merged into the configuration document as JSON, for
# example modules and limits.
extraConfig: {}

# Extra volumes and mounts on the broker container, for mounting a users
# file or an ACL file referenced from extraConfig without baking an image.
extraVolumes: []
extraVolumeMounts: []

nodeSelector: {}
tolerations: []
podAnnotations: {}
