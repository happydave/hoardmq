apiVersion: v1
kind: Service
metadata:
  name: {{ include "hoardmq.headless" . }}
  labels:
    {{- include "hoardmq.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # Peers must resolve each other before they are ready: joining is what
  # makes them ready.
  publishNotReadyAddresses: true
  selector:
    {{- include "hoardmq.selectorLabels" . | nindent 4 }}
  ports:
    - name: cluster
      port: {{ .Values.cluster.port }}
      targetPort: cluster
    - name: observability
      port: {{ .Values.observability.port }}
      targetPort: observability
