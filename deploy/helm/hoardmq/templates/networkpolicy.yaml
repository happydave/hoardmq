{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hoardmq.fullname" . }}
  labels:
    {{- include "hoardmq.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hoardmq.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Peers: the release's own pods only.
    - from:
        - podSelector:
            matchLabels:
              {{- include "hoardmq.selectorLabels" . | nindent 14 }}
      ports:
        - port: cluster
          protocol: TCP
    - ports:
        - port: mqtt
          protocol: TCP
        {{- if .Values.listeners.mqtts.enabled }}
        - port: mqtts
          protocol: TCP
        {{- end }}
        {{- range .Values.listeners.extra }}
        - port: {{ .name }}
          protocol: TCP
        {{- end }}
      {{- with .Values.networkPolicy.clientFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        - port: observability
          protocol: TCP
      {{- with .Values.networkPolicy.observabilityFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
