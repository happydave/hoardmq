apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hoardmq.fullname" . }}
  labels:
    {{- include "hoardmq.labels" . | nindent 4 }}
{{- if not (has .Values.tls.mode (list "generated" "certManager" "certManagerCSI")) }}
{{- fail (printf "tls.mode %q is not one of generated, certManager, certManagerCSI" (toString .Values.tls.mode)) }}
{{- end }}
{{- if lt (int .Values.cluster.maxReplicas) 1 }}
{{- fail "cluster.maxReplicas must be at least 1" }}
{{- end }}
{{- if gt (int .Values.replicaCount) (int .Values.cluster.maxReplicas) }}
{{- fail (printf "replicaCount %d is above cluster.maxReplicas %d: raise cluster.maxReplicas first (a rolling restart), then replicaCount" (int .Values.replicaCount) (int .Values.cluster.maxReplicas)) }}
{{- end }}
data:
  # The node name and the advertised address arrive through environment
  # overrides from the pod's own name, and each pod's own certificate is
  # mounted at the same paths (see the StatefulSet): one document serves every
  # ordinal, but each node presents its own certificate.
  config.json: |-
    {{- $base := dict
      "version" 1
      "node" (dict "dataDir" "/var/lib/hoardmq")
      "listeners" (list (dict "name" "mqtt" "type" "tcp" "address" (printf ":%d" (int .Values.listeners.mqtt.port)) "maxConnections" (int .Values.listeners.mqtt.maxConnections)))
      "limits" (dict "connectRate" (int .Values.limits.connectRate) "connectBurst" (int .Values.limits.connectBurst) "maxSubscriptions" (int .Values.limits.maxSubscriptions) "maxKeepAlive" (int .Values.limits.maxKeepAlive) "maxInflightMessages" (int .Values.limits.maxInflightMessages))
      "cluster" (dict
        "id" .Values.cluster.id
        "replicas" (int .Values.cluster.replicas)
        "shards" (int .Values.cluster.shards)
        "listen" (printf ":%d" (int .Values.cluster.port))
        "auth" (dict "mode" "mtls" "tls" (dict "certFile" "/etc/hoardmq-tls/tls.crt" "keyFile" "/etc/hoardmq-tls/tls.key" "caFile" "/etc/hoardmq-tls/ca.crt"))
        "discovery" (dict "mode" "dns" "dns" (dict "service" (include "hoardmq.headless" .) "name" (include "hoardmq.fullname" .) "replicas" (int .Values.cluster.maxReplicas) "port" (int .Values.cluster.port)))
        "drain" (dict "ratePerSecond" (int .Values.cluster.drain.ratePerSecond) "timeoutMs" (mul 1000 (int .Values.cluster.drain.timeoutSeconds)) "confirmTimeoutMs" (mul 1000 (int .Values.cluster.drain.confirmTimeoutSeconds)) "holdExitMs" (mul 1000 (int .Values.cluster.drain.holdExitSeconds)))
        "readiness" (dict "stableMs" (mul 1000 (int .Values.cluster.readiness.stableSeconds))))
      "auth" (dict "anonymous" .Values.auth.anonymous)
      "log" (dict "level" .Values.logLevel "format" "json")
      "observability" (dict "address" (printf "0.0.0.0:%d" (int .Values.observability.port)) "allowRemote" true)
      "modules" (dict "metrics.prometheus" (dict))
    -}}
    {{- if .Values.listeners.mqtts.enabled }}
    {{- $_ := set $base "listeners" (append (get $base "listeners") (dict "name" "mqtts" "type" "tls" "address" (printf ":%d" (int .Values.listeners.mqtts.port)) "maxConnections" (int .Values.listeners.mqtts.maxConnections) "tls" (dict "certFile" "/etc/hoardmq/client-tls/tls.crt" "keyFile" "/etc/hoardmq/client-tls/tls.key"))) }}
    {{- end }}
    {{- $names := dict "mqtt" true "mqtts" true }}
    {{- range $i, $l := .Values.listeners.extra }}
    {{- if not (and $l.name $l.type $l.port) }}
    {{- fail (printf "listeners.extra[%d] needs name, type and port" $i) }}
    {{- end }}
    {{- if hasKey $names $l.name }}
    {{- fail (printf "listeners.extra[%d]: the name %q is taken" $i $l.name) }}
    {{- end }}
    {{- $_ := set $names $l.name true }}
    {{- $entry := omit $l "port" }}
    {{- $_ := set $entry "address" (printf ":%d" (int $l.port)) }}
    {{- $_ := set $base "listeners" (append (get $base "listeners") $entry) }}
    {{- end }}
    {{- if and (not .Values.admin.enabled) (hasKey .Values.extraConfig "admin") }}
    {{- fail "extraConfig.admin configures the admin API, which closes the observability listener's /drain the preStop posts to: set admin.enabled so the preStop drains through the API" }}
    {{- end }}
    {{- if .Values.admin.enabled }}
    {{- /* Loopback only: kubectl port-forward reaches it, the network does
           not, so no TLS is needed. The preStop's token may drain and read
           the drain's status, nothing else. */}}
    {{- $_ := set $base "admin" (dict
      "address" (printf "127.0.0.1:%d" (int .Values.admin.port))
      "tokens" (list
        (dict "name" "prestop-drain" "tokenFile" "/etc/hoardmq/admin/drain.token" "scopes" (list "cluster:drain" "cluster:read"))
        (dict "name" "operator" "tokenFile" "/etc/hoardmq/admin/operator.token" "scopes" (list "admin")))) }}
    {{- end }}
    {{- $merged := mergeOverwrite $base (deepCopy .Values.extraConfig) }}
    {{- $merged | toPrettyJson | nindent 4 }}
