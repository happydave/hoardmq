{{- if eq .Values.tls.mode "generated" }}
{{- $secretName := include "hoardmq.tlsSecret" . }}
{{- $caName := include "hoardmq.tlsCASecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingCA := lookup "v1" "Secret" .Release.Namespace $caName }}
{{- $days := int .Values.tls.generatedValidityDays }}
{{- $headless := include "hoardmq.headless" . }}
{{- $data := dict }}
{{- if $existing }}
{{- $data = deepCopy $existing.data }}
{{- end }}
{{- $ca := dict }}
{{- if $existingCA }}
{{- $ca = buildCustomCert (index $existingCA.data "ca.crt") (index $existingCA.data "ca.key") }}
{{- if and $existing (ne (index $existing.data "ca.crt") (index $existingCA.data "ca.crt")) }}
{{- fail (printf "Secret %s holds certificates from another CA than Secret %s: delete both and upgrade, then restart every pod (kubectl rollout restart statefulset/%s)" $secretName $caName (include "hoardmq.fullname" .)) }}
{{- end }}
{{- else if not $existing }}
{{- $ca = genCA (printf "%s cluster CA" (include "hoardmq.fullname" .)) $days }}
{{- end }}
{{- /* One certificate per ordinal: peers check that the common name is the
       node name the peer claims in its hello, so a single shared common name
       cannot authenticate a cluster. An ordinal already issued keeps its
       certificate; a new one is signed by the stored CA. */}}
{{- range $i := until (int .Values.replicaCount) }}
{{- $pod := printf "%s-%d" (include "hoardmq.fullname" $) $i }}
{{- if not (hasKey $data (printf "%s.crt" $pod)) }}
{{- if not $ca }}
{{- fail (printf "Secret %s has no certificate for %s and no CA key is stored to sign one: delete Secret %s and upgrade, then restart every pod (kubectl rollout restart statefulset/%s)" $secretName $pod $secretName (include "hoardmq.fullname" $)) }}
{{- end }}
{{- $sans := list $headless (printf "%s.%s.svc" $headless $.Release.Namespace) (printf "%s.%s" $pod $headless) (printf "%s.%s.%s.svc" $pod $headless $.Release.Namespace) }}
{{- $cert := genSignedCert $pod nil $sans $days $ca }}
{{- $_ := set $data (printf "%s.crt" $pod) ($cert.Cert | b64enc) }}
{{- $_ := set $data (printf "%s.key" $pod) ($cert.Key | b64enc) }}
{{- end }}
{{- end }}
{{- if not $existing }}
{{- $_ := set $data "ca.crt" ($ca.Cert | b64enc) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "hoardmq.labels" . | nindent 4 }}
  annotations:
    # Keep the node certificates across upgrades and uninstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value }}
  {{- end }}
{{- if or $existingCA (not $existing) }}
---
# The CA's key signs the certificates of ordinals added later. No pod mounts
# this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $caName }}
  labels:
    {{- include "hoardmq.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existingCA }}
  ca.crt: {{ index $existingCA.data "ca.crt" }}
  ca.key: {{ index $existingCA.data "ca.key" }}
  {{- else }}
  ca.crt: {{ $ca.Cert | b64enc }}
  ca.key: {{ $ca.Key | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
