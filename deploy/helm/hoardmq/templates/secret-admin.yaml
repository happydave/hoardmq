{{- if .Values.admin.enabled }}
{{- $secretName := include "hoardmq.adminSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "hoardmq.labels" . | nindent 4 }}
  annotations:
    # Keep the tokens across upgrades and uninstall, as the cluster CA is kept.
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- if $existing }}
  {{- range $key, $value := $existing.data }}
  {{ $key }}: {{ $value }}
  {{- end }}
{{- else }}
  {{- /* drain.token: the preStop's, scoped to the drain. operator.token: every
         scope; read it with kubectl get secret. */}}
  drain.token: {{ randAlphaNum 48 | b64enc }}
  operator.token: {{ randAlphaNum 48 | b64enc }}
{{- end }}
{{- end }}
