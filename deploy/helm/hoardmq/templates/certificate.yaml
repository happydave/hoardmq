{{- if or (eq .Values.tls.mode "certManager") (eq .Values.tls.mode "certManagerCSI") }}
{{- $issuerName := include "hoardmq.tlsIssuerName" . }}
{{- $issuerKind := include "hoardmq.tlsIssuerKind" . }}
{{- if not .Values.tls.certManager.issuerRef.name }}
{{- /* Without an issuer of its own the chart makes a private CA: a
       self-signed issuer signs one CA certificate, and a CA issuer signs the
       nodes'. A self-signed issuer signing the nodes' directly would give
       each node its own root, and no peer would verify. */}}
{{- $selfSigned := printf "%s-selfsigned" (include "hoardmq.fullname" .) }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $selfSigned }}
  labels:
    {{- include "hoardmq.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "hoardmq.tlsCASecret" . }}
  labels:
    {{- include "hoardmq.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: {{ include "hoardmq.fullname" . }} cluster CA
  secretName: {{ include "hoardmq.tlsCASecret" . }}
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ $selfSigned }}
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $issuerName }}
  labels:
    {{- include "hoardmq.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ include "hoardmq.tlsCASecret" . }}
---
{{- end }}
{{- if eq .Values.tls.mode "certManager" }}
{{- /* One Certificate per ordinal: the common name is the node name, which is
       what a peer checks against the hello it receives. A peer also needs
       both auth usages, which cert-manager adds only when asked. Every
       ordinal below the maximum has one, since every pod's volume names all
       of their Secrets. */}}
{{- range $i := until (int .Values.cluster.maxReplicas) }}
{{- $pod := printf "%s-%d" (include "hoardmq.fullname" $) $i }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "hoardmq.tlsSecret" $ }}-{{ $i }}
  labels:
    {{- include "hoardmq.labels" $ | nindent 4 }}
spec:
  secretName: {{ include "hoardmq.tlsSecret" $ }}-{{ $i }}
  duration: 2160h
  renewBefore: 360h
  commonName: {{ $pod }}
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
  dnsNames:
    - {{ include "hoardmq.headless" $ }}
    - {{ include "hoardmq.headless" $ }}.{{ $.Release.Namespace }}.svc
    - {{ $pod }}.{{ include "hoardmq.headless" $ }}
    - {{ $pod }}.{{ include "hoardmq.headless" $ }}.{{ $.Release.Namespace }}.svc
  issuerRef:
    name: {{ $issuerName }}
    kind: {{ $issuerKind }}
---
{{- end }}
{{- end }}
{{- end }}
