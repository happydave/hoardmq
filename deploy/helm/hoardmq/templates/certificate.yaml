{{- if eq .Values.tls.mode "certManager" }}
{{- $issuerName := .Values.tls.certManager.issuerRef.name }}
{{- $issuerKind := .Values.tls.certManager.issuerRef.kind }}
{{- if not $issuerName }}
{{- $issuerName = printf "%s-selfsigned" (include "hoardmq.fullname" .) }}
{{- $issuerKind = "Issuer" }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $issuerName }}
  labels:
    {{- include "hoardmq.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
{{- end }}
{{- /* One Certificate per ordinal: the common name is the node name, which is
       what a peer checks against the hello it receives. */}}
{{- range $i := until (int .Values.replicaCount) }}
{{- $pod := printf "%s-%d" (include "hoardmq.fullname" $) $i }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "hoardmq.tlsSecret" $ }}-{{ $i }}
  labels:
    {{- include "hoardmq.labels" $ | nindent 4 }}
spec:
  secretName: {{ include "hoardmq.tlsSecret" $ }}-{{ $i }}
  duration: 2160h
  renewBefore: 360h
  commonName: {{ $pod }}
  dnsNames:
    - {{ include "hoardmq.headless" $ }}
    - {{ include "hoardmq.headless" $ }}.{{ $.Release.Namespace }}.svc
    - {{ $pod }}.{{ include "hoardmq.headless" $ }}
    - {{ $pod }}.{{ include "hoardmq.headless" $ }}.{{ $.Release.Namespace }}.svc
  issuerRef:
    name: {{ $issuerName }}
    kind: {{ $issuerKind }}
---
{{- end }}
{{- end }}
